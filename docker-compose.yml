services:
  nginx:
    image: nginx:alpine
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - traefik
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.topvoice.rule=Host(`topvoicetgn.test`)"
      - "traefik.http.routers.topvoice.entrypoints=web"
      - "traefik.http.services.topvoice.loadbalancer.server.port=80"
    restart: unless-stopped

  php:
    build: ./docker
    volumes:
      - .:/var/www/html
    command: >
      sh -c "composer install --no-dev --no-interaction --quiet 2>/dev/null; php-fpm"
    restart: unless-stopped

networks:
  traefik:
    external: true
