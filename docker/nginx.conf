# How long browsers may keep static files. First match wins.
map $request_uri $static_expires {
    default                          off;
    ~/_app/immutable/                1y;   # Admin Next, hashed names
    ~^/images/                       1y;   # Grav image cache, hashed names
    ~^/user/themes/[^?]+\?v=         1y;   # theme CSS/JS with ?v=<mtime>
    ~^/user/themes/                  30d;  # theme images and fonts
    ~^/user/plugins/                 1d;   # plugin assets, no version
}

server {
    listen 80;
    server_tokens off;
    index index.html index.php;

    root /var/www/html;
    server_name _;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # deny hidden files and directories at any depth, except ACME challenges
    location ~ (^|/)\.(?!well-known(?:/|$)) { return 403; }
    # deny all direct access for these folders
    location ~* ^/(\.git|cache|bin|logs|backup|tmp|tests)/.*$ { return 403; }
    # deny all direct access to these sensitive user folders
    location ~* ^/user/(env/[^/]+/)?config/.*$ { return 403; }
    # allow avatar images
    location ~* ^/user/(env/[^/]+/)?accounts/[^/]+/[^/]+\.(jpe?g|png|gif|webp|avif|bmp|ico)$ { try_files $uri =404; }
    # deny everything else under user/accounts
    location ~* ^/user/(env/[^/]+/)?accounts/.*$ { return 403; }
    # allow public media uploads under user/data
    location ~* ^/user/(env/[^/]+/)?data/.*\.(jpe?g|png|gif|webp|avif|bmp|ico|mp4|webm|ogg|ogv|mov|mp3|wav|m4a|flac|pdf)$ { try_files $uri =404; }
    # deny everything else under user/data
    location ~* ^/user/(env/[^/]+/)?data/.*$ { return 403; }
    # deny running scripts in the public cache folders
    location ~* ^/(images|assets)/.*\.(php|php2|php3|php4|php5|php7|php8|phar|phtml|pht|phtm|phps|pl|py|cgi|sh|bat)$ { return 403; }
    # deny running scripts inside core system folders
    location ~* ^/(system|vendor)/.*\.(txt|xml|md|html|htm|shtml|shtm|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }
    # deny running scripts inside user folder
    location ~* ^/user/.*\.(txt|md|json|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$ { return 403; }
    # deny access to specific files in the root folder
    location ~ ^/(LICENSE\.txt|composer\.lock|composer\.json|nginx\.conf|web\.config|htaccess\.txt|\.htaccess) { return 403; }
    location ~ /\.env(\.|$) { return 403; }
    # deny the local Docker setup and Composer leftovers
    location ~ ^/(docker/|docker-compose\.yml|composer\.phar|composer-setup\.php) { return 403; }

    # Static files: browser cache time comes from $static_expires (map above).
    # Keep this after the security rules so their 403s still win.
    location ~* \.(css|js|mjs|wasm|woff2?|ttf|otf|eot|jpe?g|png|gif|webp|avif|svg|ico|webmanifest|mp4|webm|mp3)$ {
        expires $static_expires;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
    }
}
