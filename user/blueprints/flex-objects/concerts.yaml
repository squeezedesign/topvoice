title: Concerts
description: Concerts i actuacions de Top Voice TGN
type: flex-objects

config:
  admin:
    router:
      path: '/concerts'
    menu:
      list:
        route: '/concerts'
        title: Concerts
        icon: fa-music
        authorize: ['admin.super', 'admin.login']
        priority: 6
    template: default
    permissions:
      admin.concerts:
        type: crudpl
        label: Concerts
    list:
      title: venue
      fields:
        active:
          title: SITE.CONCERTS.FIELD_ACTIVE
        # Admin Next formats a date column (dd/mm/yyyy in a ca/es browser)
        # only when it is not the edit link, which shows the raw value.
        date:
          title: SITE.CONCERTS.FIELD_DATE
        hour:
          title: SITE.CONCERTS.FIELD_HOUR
        # The list template renders headers from field.label (not title), so we
        # override label per column here to keep short headers while the form
        # labels stay descriptive. These are all text fields → type defaults to text.
        venue:
          link: edit
          title: SITE.CONCERTS.COL_NAME
          field:
            label: SITE.CONCERTS.COL_NAME
        place:
          title: SITE.CONCERTS.COL_PLACE
          field:
            label: SITE.CONCERTS.COL_PLACE
        context:
          title: SITE.CONCERTS.COL_CONTEXT_CA
          field:
            label: SITE.CONCERTS.COL_CONTEXT_CA
        context_es:
          title: SITE.CONCERTS.COL_CONTEXT_ES
          field:
            label: SITE.CONCERTS.COL_CONTEXT_ES
        format:
          title: SITE.CONCERTS.FIELD_FORMAT
        show_format:
          title: SITE.CONCERTS.FIELD_SHOW_FORMAT
    edit:
      title:
        # Admin Next only fills {{ object.x }} and {{ object.x ?? 'y' }}, no Twig tags; still valid Twig for Admin 1.x
        template: "{{ object.date ?? 'Nou' }} — {{ object.venue }}"
    preview:
      enabled: false
    export:
      enabled: false

  site:
    templates:
      collection:
        paths:
          - 'flex/{TYPE}/collection/{LAYOUT}{EXT}'
      object:
        paths:
          - 'flex/{TYPE}/object/{LAYOUT}{EXT}'
      defaults:
        type: concerts
        layout: default

  data:
    object: 'Grav\Common\Flex\Types\Generic\GenericObject'
    collection: 'Grav\Common\Flex\Types\Generic\GenericCollection'
    index: 'Grav\Common\Flex\Types\Generic\GenericIndex'
    storage:
      class: 'Grav\Framework\Flex\Storage\SimpleStorage'
      options:
        formatter:
          class: 'Grav\Framework\File\Formatter\JsonFormatter'
        folder: user-data://flex-objects/concerts.json

form:
  validation: loose

  fields:
    active:
      type: toggle
      label: SITE.CONCERTS.FIELD_ACTIVE
      help: SITE.CONCERTS.FIELD_ACTIVE_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool
    # Not required in the blueprint: Grav would apply it even while the date is
    # hidden. topvoice-hooks refuses to save without a date unless date_tbd.
    date_tbd:
      type: toggle
      label: SITE.CONCERTS.FIELD_DATE_TBD
      help: SITE.CONCERTS.FIELD_DATE_TBD_HELP
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool
    # Admin Next evaluates this condition on the form values (Grav core only
    # treats the block as a container), hiding the date while it is pending.
    date_fields:
      type: conditional
      # A container, not a value: keeps date and month_only at the top level.
      # The Form plugin says so for its own forms, but not for Flex API saves.
      input@: false
      condition: "date_tbd != true"
      fields:
        date:
          type: date
          label: SITE.CONCERTS.FIELD_DATE
          help: SITE.CONCERTS.FIELD_DATE_HELP
        month_only:
          type: toggle
          label: SITE.CONCERTS.FIELD_MONTH_ONLY
          help: SITE.CONCERTS.FIELD_MONTH_ONLY_HELP
          highlight: 1
          default: 0
          options:
            1: PLUGIN_ADMIN.YES
            0: PLUGIN_ADMIN.NO
          validate:
            type: bool
    hour:
      type: time
      label: SITE.CONCERTS.FIELD_HOUR
      placeholder: '22:00'
      help: SITE.CONCERTS.FIELD_HOUR_HELP
      validate:
        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        message: SITE.CONCERTS.FIELD_HOUR_ERROR
    venue:
      type: text
      label: SITE.CONCERTS.FIELD_VENUE
      placeholder: 'Tarragona, Reus...'
      validate:
        required: true
    place:
      type: text
      label: SITE.CONCERTS.FIELD_PLACE
      placeholder: 'Plaça Major, Auditori...'
    context:
      type: text
      label: SITE.CONCERTS.FIELD_CONTEXT
      placeholder: 'Setmana Cultural, Festa Major...'
    context_es:
      type: text
      label: SITE.CONCERTS.FIELD_CONTEXT_ES
      placeholder: 'Semana Cultural, Fiesta Mayor...'
    format:
      type: select
      label: SITE.CONCERTS.FIELD_FORMAT
      default: banda
      options:
        essencial: SITE.CONCERTS.FORMAT.ESSENCIAL
        banda: SITE.CONCERTS.FORMAT.BANDA
        cor: SITE.CONCERTS.FORMAT.COR
    show_format:
      type: toggle
      label: SITE.CONCERTS.FIELD_SHOW_FORMAT
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.YES
        0: PLUGIN_ADMIN.NO
      validate:
        type: bool
