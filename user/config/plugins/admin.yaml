enabled: true
route: /admin
cache_enabled: true
theme: grav
logo_text: null
body_classes: null
content_padding: true
twofa_enabled: true
sidebar:
  activate: tab
  hover_delay: 100
  size: auto
dashboard:
  days_of_stats: 15
widgets_display:
  dashboard-maintenance: 'true'
  dashboard-statistics: 'true'
  dashboard-notifications: 'false'
  dashboard-feed: 'false'
  dashboard-pages: 'true'
pages:
  show_parents: both
  show_modular: true
  parents_levels: null
session:
  timeout: 1800
edit_mode: normal
frontend_preview_target: inline
show_github_msg: false
admin_icons: line-awesome
enable_auto_updates_check: true
notifications:
  feed: true
  dashboard: true
  plugins: true
  themes: true
popularity:
  enabled: true
  ignore:
    - '/test*'
    - /modular
  history:
    daily: '30'
    monthly: '12'
    visitors: '20'
whitelabel:
  quicktray_recompile: true
  codemirror_theme: 3024-day
  codemirror_fontsize: md
  codemirror_md_font: sans
  logo_custom:
    user/assets/topvoice_logo_txt.webp:
      name: topvoice_logo_txt.webp
      full_path: topvoice_logo_txt.webp
      type: image/webp
      size: 4320
      path: user/assets/topvoice_logo_txt.webp
  logo_login:
    user/assets/top_voice_logo.webp:
      name: top_voice_logo.webp
      full_path: top_voice_logo.webp
      type: image/webp
      size: 28332
      path: user/assets/top_voice_logo.webp
  color_scheme:
    accents:
      primary-accent: button
      secondary-accent: notice
      tertiary-accent: critical
    colors:
      logo-bg: '#0d0d14'
      logo-link: '#ffffff'
      nav-bg: '#0d0d14'
      nav-text: '#8080a0'
      nav-link: '#c8c8e0'
      nav-selected-bg: '#46254f'
      nav-selected-link: '#ffffff'
      nav-hover-bg: '#1e1e32'
      nav-hover-link: '#00C9B1'
      toolbar-bg: '#ffffff'
      toolbar-text: '#4a4a5a'
      page-bg: '#f0f0f8'
      page-text: '#6b6b80'
      page-link: '#cb8cdb'
      content-bg: '#ffffff'
      content-text: '#3d3d50'
      content-link: '#E8006A'
      content-link2: '#00C9B1'
      content-header: '#844394'
      content-tabs-bg: '#f5f5fc'
      content-tabs-text: '#6b6b80'
      button-bg: '#8d2ba6'
      button-text: '#ffffff'
      notice-bg: '#2e8076'
      notice-text: '#ffffff'
      update-bg: '#00C9B1'
      update-text: '#ffffff'
      critical-bg: '#c41c3a'
      critical-text: '#ffffff'
      content-highlight: '#fff0f6'
    name: TopVoice
  custom_footer: "Top Voice |\_Cor Modern TGN"
  custom_css: "#admin-login h1.custom-logo {\n    padding: 0 2rem;\n}\n#admin-login h1.custom-logo {\n  padding: 0 2rem;\n}\n#admin-login-wrapper {\n    background: radial-gradient(circle at center, #2c0836 40%, black 100%);\n}\n#admin-login form input {\n    font-size: 1rem;\n    color: #d0d0d0;\n    background: #27272b;\n    border: 1px solid #7c2692;\n}\n\n#admin-login form input::placeholder {\n    color: #8a8a9a;\n}\n.admin-logo.custom-logo {\n    width: 100%;\n    justify-content: space-between;\n    padding: 0 15px;\n}\n\n#admin-logo .front-end {\n    padding-right: 15px;\n}\n\n#admin-logo .admin-logo.custom-logo img {\n    max-height: 42px;\n}\n#pages-filters {\n  background: #dddddd !important;\n  color: #0b0a0e !important;\n}\n#pages-filters a,\n#pages-filters .button-border {\n  color: #0b0a0e !important;\n}\n#pages-filters .filters-bar input {\n  background-color: #dddddd !important;\n  color: #0b0a0e !important;\n}\n#pages-filters .filters-advanced fieldset legend {\n  background: #dddddd !important;\n  color: #0b0a0e !important;\n}\n#pages-filters form .checkboxes label:before {\n  background: #dddddd !important;\n  color: #0b0a0e !important;\n}\n\n#pages-filters .filters-bar input::placeholder {\n  color: #9b94a6 !important;\n}\n"
  custom_presets: null
show_beta_msg: null
pagemedia:
  resize_width: 0
  resize_height: 0
  res_min_width: 0
  res_min_height: 0
  res_max_width: 0
  res_max_height: 0
  resize_quality: 0.8
