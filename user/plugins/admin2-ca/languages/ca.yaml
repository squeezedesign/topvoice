        SECURITY_CHECK:
            USER_FOLDER_EXPOSED_TITLE: "El teu servidor web no aplica les regles d'accés de Grav"
            USER_FOLDER_EXPOSED_BODY: "El teu servidor web no aplica les regles d'accés recomanades per Grav, de manera que es pot accedir directament per web als fitxers de user/. Val la pena reforçar-ho, ja que alguns plugins hi desen dades."
            STORAGE_EXPOSED_BODY: "El servidor web ha servit fitxers de prova des de directoris que haurien de ser privats. Els tipus de fitxer llistats a continuació poden exposar trameses desades, còpies de seguretat o fitxers temporals. Demana al teu proveïdor d'allotjament que bloquegi l'accés directe, o mou l'emmagatzematge privat fora de l'arrel web."
            USER_FOLDER_EXPOSED_LEARN_MORE: 'Com solucionar-ho'
            STORAGE_EXPOSED_TITLE: "Es poden baixar d'aquest lloc fitxers que haurien de ser privats"
            STORAGE_EXPOSED_COUNT: '{n, plural, one {# tipus de fitxer} other {# tipus de fitxer}}'
            STORAGE_EXPOSED_TMP: 'Els fitxers de prova a tmp/ es podien baixar, mentre que les altres carpetes estaven bloquejades. Les regles del teu servidor probablement són anteriors a Grav 2.1.7, que va afegir tmp/ a la llista de carpetes bloquejades. Afegeix tmp a aquesta llista al teu .htaccess, o a la configuració de nginx, Caddy o IIS, perquè coincideixi amb les regles que inclou Grav.'
            STORAGE_EXPOSED_BY_TYPE: "Alguns tipus de fitxer estaven bloquejats en aquestes carpetes mentre que d'altres es podien baixar. Això sol significar que alguna cosa se situa davant les regles de Grav, com ara nginx servint fitxers estàtics abans que Apache, que respon a tipus de fitxer habituals com .zip abans que es comprovin les regles. Bloqueja també aquestes carpetes a la configuració d'aquesta capa."
            STORAGE_EXPOSED_ALL: "Tots els fitxers de prova es podien baixar, per la qual cosa el teu servidor web no aplica en absolut les regles d'accés de Grav. A Apache, comprova que AllowOverride permeti que el .htaccess del lloc tingui efecte. A nginx, Caddy o IIS, afegeix les regles de seguretat de la carpeta webserver-configs de Grav."
            STORAGE_EXPOSED_CDN: "Si el lloc és darrere d'una CDN com Cloudflare, buida'n la memòria cau després de solucionar-ho. Les còpies que ja té emmagatzemades es podran continuar baixant fins que ho facis."
