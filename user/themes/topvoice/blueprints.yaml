name: Top Voice
slug: topvoice
type: theme
version: 1.0.0
description: Tema personalitzat per al cor Top Voice de Tarragona
icon: music
author:
  name: Squeeze Design
  email: info@squeezedesign.es
license: MIT

form:
  validation: loose
  fields:
    dropdown.enabled:
      type: hidden
      default: 0
    gtm_id:
      type: text
      label: "ID de Google Tag Manager"
      placeholder: "GTM-XXXXXXX"
      help: "Contenidor de GTM (analítica). Buit: no es carrega GTM ni es mostra el bàner de galetes."
      validate:
        pattern: '^(GTM-[A-Z0-9]+)?$'
        message: "Ha de tenir la forma GTM-XXXXXXX, o quedar buit."
