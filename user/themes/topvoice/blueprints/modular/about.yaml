name: Qui som
description: Secció sobre el cor i els directors
extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            header.title:
              label: "Nom (ús intern)"
              help: "Identificador intern de la pàgina, no es mostra al web."
            header.section_tag:
              type: text
              label: Etiqueta de secció
              placeholder: "Qui som"
              ordering@: header.title
            header.section_title:
              type: textarea
              rows: 2
              label: Títol de secció
              placeholder: "Moltes veus, una energia"
              ordering@: header.section_tag
            header.image_alt:
              type: text
              label: "Text alternatiu de la imatge"
              help: "Descriu la foto per a qui no la pot veure (lectors de pantalla, cercadors). Si el deixes buit, s'usa un text per defecte."
              ordering@: header.section_title
            header.media_order:
              label: "Media de la secció (logos directors, imatge grup)"
            header.directors:
              type: list
              label: Directors
              help: Afegeix o edita els directors del cor.
              style: vertical
              btnLabel: Afegir director
              fields:
                .name:
                  type: text
                  label: Nom
                .role:
                  type: text
                  label: Càrrec
                .bio_lead:
                  type: text
                  label: Bio destacada (negreta)
                .bio:
                  type: textarea
                  label: Bio completa
                .logo:
                  type: text
                  label: Nom del fitxer del logo (ex. rakel_logo_white.webp)
                .url:
                  type: text
                  label: URL del logo (enllaç extern)
        advanced:
          fields:
            columns:
              fields:
                column1:
                  fields:
                    folder:
                      disabled: true
