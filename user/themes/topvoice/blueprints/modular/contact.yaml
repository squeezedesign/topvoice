name: Contacte
description: Secció de contacte amb formulari i dades
extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            content:
              unset@: true
            header.media_order:
              unset@: true
            header.title:
              label: "Nom (ús intern)"
              help: "Identificador intern de la pàgina, no es mostra al web."
            header.section_tag:
              type: text
              label: Etiqueta de secció
              placeholder: "Contacte"
              ordering@: header.title
            header.section_title:
              type: textarea
              rows: 2
              label: Títol principal
              placeholder: "Contracta'ns"
              ordering@: header.section_tag
            header.hire_intro:
              type: markdown
              label: Text introductori
              ordering@: header.section_title
            separator_config:
              type: spacer
              title: "Configuració tècnica del formulari"
              text: "Modifica només si cal canviar l'adreça on arriben els missatges del formulari."
              underline: true
            header.form_email:
              type: text
              label: Email destinació del formulari
              help: "Adreça on arribaran els missatges enviats pel formulari"
              placeholder: topvoicetgn@gmail.com
        advanced:
          fields:
            columns:
              fields:
                column1:
                  fields:
                    folder:
                      disabled: true
