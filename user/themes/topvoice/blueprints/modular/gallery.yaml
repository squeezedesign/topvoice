name: Galeria
description: Galeria de fotos amb slider
extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          fields:
            content:
              unset@: true
            header.title:
              label: "Nom (ús intern)"
              help: "Identificador intern de la pàgina, no es mostra al web."
            header.section_tag:
              type: text
              label: Etiqueta de secció
              placeholder: "Galeria"
              ordering@: header.title
            header.section_title:
              type: textarea
              rows: 2
              label: Títol de secció
              placeholder: "Moments"
              ordering@: header.section_tag
            header.media_order:
              label: "Fotos de la galeria — Puja i arrossega per ordenar"
              help: "El text alternatiu i el peu de foto de cada foto es posen a la mateixa foto (botó d'editar de la miniatura)."
        advanced:
          fields:
            columns:
              fields:
                column1:
                  fields:
                    folder:
                      disabled: true
